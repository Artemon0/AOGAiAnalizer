name: Build CS2 Plugin

on:
  push:
    branches:
      - "master"
      - "main"
  pull_request:
    branches:
      - "master"
      - "main"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore AOGAiAnalizer/AOGAiAnalizer.csproj

      - name: Build Release
        run: dotnet build AOGAiAnalizer/AOGAiAnalizer.csproj --no-restore -c Release

      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AOGAiAnalizer
          path: AOGAiAnalizer/bin/Release/net8.0/AOGAiAnalizer.dll

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.2.${{ github.run_number }}"

          gh release create $tag `
            "AOGAiAnalizer/bin/Release/net8.0/AOGAiAnalizer.dll" `
            --title "AOGAiAnalizer $tag" `
            --generate-notes
