name: Build CS2 Plugin

on:
  push:
    branches:
      - "master"
      - "main"
  pull_request:
    branches:
      - "master"
      - "main"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore AOGAiAnalizer/AOGAiAnalizer.csproj

      - name: Build Release
        run: dotnet build AOGAiAnalizer/AOGAiAnalizer.csproj --no-restore -c Release

      - name: Upload Windows DLL
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AOGAiAnalizer-Windows
          path: AOGAiAnalizer/bin/Release/net8.0/AOGAiAnalizer.dll

      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: AOGAiAnalizer-Linux
          path: AOGAiAnalizer/bin/Release/net8.0/AOGAiAnalizer.so
